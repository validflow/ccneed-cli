name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      retry_version:
        description: 'Rebuild an unpublished version already in package.json'
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan:
    if: github.repository == 'validflow/ccneed-cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Detect explicit version change, not PR type or branch name
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
          RETRY_VERSION: ${{ inputs.retry_version }}
        run: node scripts/release/prepare.mjs

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true' && vars.CCNEED_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Pin npm for deterministic release gates
        run: npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund
      - name: Deterministic release gates
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          node scripts/release/preflight.mjs
          npm test
          bash scripts/check.sh
          go test -race -count=1 ./...
          node -e 'if (require("child_process").execFileSync("npm",["--version"],{encoding:"utf8"}).trim() !== "11.21.0") process.exit(1)'
      - name: Build and verify all platform assets and matching npm/Skill package
        run: node scripts/release/build.mjs
      - name: Preserve exact assets for failure recovery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true' && vars.CCNEED_RELEASE_ENABLED == 'true'
    concurrency:
      group: ccneed-cli-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: npm-release
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Pin npm with OIDC publishing and dist-tag support
        run: npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund
      - name: Download the exact gated build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
      - name: Verify release identity, tag main, publish assets and npm
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/publish.mjs

  notify:
    needs: [plan, publish]
    if: needs.plan.outputs.release == 'true' && needs.publish.result == 'success' && vars.CCNEED_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      MULTICA_CLI_RELEASE_WEBHOOK_URL: ${{ secrets.MULTICA_CLI_RELEASE_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Notify Multica only after verified publication
        run: node scripts/release/notify.mjs
