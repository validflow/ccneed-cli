name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Test and build
        shell: bash
        run: |
          go test -count=1 ./...
          go build ./...

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Deterministic quality gate
        run: bash scripts/check.sh
      - name: Race detector
        run: go test -race -count=1 ./...

  quality:
    if: always()
    needs: [platform, checks]
    runs-on: ubuntu-latest
    steps:
      - name: Require all gates
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          test "$PLATFORM_RESULT" = success
          test "$CHECKS_RESULT" = success
