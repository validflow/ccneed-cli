version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - ineffassign
    - unused
    - gocyclo
    - nolintlint
  settings:
    gocyclo:
      min-complexity: 11
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - disableStutteringCheck
